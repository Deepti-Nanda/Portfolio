<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Deepti Nanda — Building technology that solves real-world problems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243329"/>
      <stop offset="0.5" stop-color="#1D2B22"/>
      <stop offset="1" stop-color="#243329"/>
    </linearGradient>
    <radialGradient id="lime">
      <stop offset="0" stop-color="#7DAA46" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7DAA46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal">
      <stop offset="0" stop-color="#12483A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#12483A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald">
      <stop offset="0" stop-color="#46966A" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#46966A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>

    <!-- Drifting background glow, like the site's hero. -->
    <circle cx="220" cy="70" r="340" fill="url(#lime)">
      <animate attributeName="cx" values="220;470;220" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;150;70" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="90" r="320" fill="url(#teal)">
      <animate attributeName="cx" values="1120;900;1120" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="400" r="360" fill="url(#emerald)">
      <animate attributeName="cx" values="680;860;680" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Water ripples, like tapping the hero. -->
    <g fill="none" stroke="#CDE6B4" stroke-width="2.5">
      <ellipse cx="1030" cy="250" rx="0" ry="0" opacity="0">
        <animate attributeName="rx" values="0;190" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;80" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1030" cy="250" rx="0" ry="0" opacity="0">
        <animate attributeName="rx" values="0;190" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;80" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1030" cy="250" rx="0" ry="0" opacity="0">
        <animate attributeName="rx" values="0;190" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;80" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="96" y="170" font-size="84" font-weight="700" fill="#E8EDE4" letter-spacing="-1">Deepti <tspan fill="#9CC562">Nanda</tspan></text>
      <text x="98" y="226" font-size="28" fill="#C7D3C3">Building technology that solves real-world problems</text>
      <text x="98" y="276" font-size="19" fill="#93A890" letter-spacing="0.5">FULL-STACK DEVELOPER  ·  BCA, SARALA BIRLA UNIVERSITY  ·  RANCHI, INDIA</text>
    </g>
  </g>
</svg>
